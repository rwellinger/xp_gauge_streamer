<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>xp_gauge_streamer</title>
    <style>
        body {
            margin: 0;
            padding: 1rem;
            background: #101214;
            color: #8a9199;
            font: 0.9rem/1.4 system-ui, sans-serif;
        }

        main {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
        }

        figure {
            margin: 0;
        }

        figcaption {
            padding-top: 0.4rem;
            text-align: center;
        }

        img {
            display: block;
            max-width: 100%;
        }

        p {
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- Phase 6 replaces this page with the operable bezel. -->
    <main><p id="status">Looking for GNS units…</p></main>

    <script>
        // Which units exist depends on the aircraft's panel, so the server is
        // asked rather than guessed. Its answer takes a moment: capturing only
        // starts once somebody is watching.
        fetch('/devices')
            .then(response => response.json())
            .then(({ devices }) => {
                const streaming = devices.filter(device => device.streaming);
                const main = document.querySelector('main');

                if (streaming.length === 0) {
                    document.getElementById('status').textContent =
                        'No GNS unit in this aircraft.';
                    return;
                }

                main.replaceChildren(...streaming.map(device => {
                    const figure = document.createElement('figure');
                    const image = document.createElement('img');
                    image.src = `/stream/${device.slug}`;
                    image.alt = device.name;
                    const caption = document.createElement('figcaption');
                    caption.textContent = device.name;
                    figure.append(image, caption);
                    return figure;
                }));
            })
            .catch(() => {
                document.getElementById('status').textContent = 'Plugin not reachable.';
            });
    </script>
</body>
</html>
