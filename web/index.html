<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <!-- user-scalable=no: a double tap next to a button must not zoom the page
         away mid-flight. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- Key captions are abbreviations, not prose: a browser that offers to
         translate the page turns DES into "OF THE" and LEGS into "LEGACY". -->
    <meta name="google" content="notranslate">
    <title>Welly's Gauge Streamer</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <h1>Welly's Gauge Streamer</h1>
        <p id="status" data-state="connecting">Loading…</p>
    </header>

    <main id="devices" class="picker" aria-label="Devices"></main>

    <script type="module" src="/index.js"></script>
</body>
</html>
