<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <!-- user-scalable=no: a double tap next to a button must not zoom the page
         away mid-flight. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <title>xp_gauge_streamer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav id="devices" aria-label="Device"></nav>
        <p id="status" data-state="connecting">Connecting…</p>
    </header>

    <main>
        <section id="screen">
            <img id="stream" alt="GNS screen">
        </section>
        <section id="bezel" aria-label="Bezel"></section>
    </main>

    <script src="app.js"></script>
</body>
</html>
