name: Build

on:
  pull_request:
    branches: [main]
    # A pull request touching nothing but prose cannot break a compile, so it
    # does not pay for one. The filter applies only when *every* changed file
    # matches — a commit that edits the README and a source file still builds.
    #
    # Careful if main ever becomes a protected branch with required checks: a
    # skipped workflow reports nothing, and a required check that never
    # reports blocks the merge for good. The way out then is a job that always
    # runs and decides for itself whether to do any work.
    paths-ignore:
      - '**.md'
      - 'images/**'
      - '.cursor/**'
      - 'LICENSE'
  # Tags are never filtered: a release builds whatever it is cut from.
  push:
    tags:
      - 'v*'

jobs:
  # Runs on macOS rather than Linux (unlike xp_pilot): this plugin links the
  # macOS XPLM stub frameworks, so CMake refuses to configure elsewhere.
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Setup dependencies
        run: make setup

      # Through the Makefile rather than a second clang-tidy invocation here:
      # the file list has to come from compile_commands.json, and one copy of
      # that logic is enough.
      - name: Run clang-tidy
        run: make lint

  build-macos:
    needs: [lint]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup dependencies
        run: make setup

      - name: Build
        run: |
          RELEASE_FLAG=""
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then RELEASE_FLAG="-DRELEASE=ON"; fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release $RELEASE_FLAG -Wno-dev
          cmake --build build --parallel

      - name: Run tests
        run: ./build/xp_gauge_streamer_tests

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: xp_gauge_streamer-macos
          path: build/xp_gauge_streamer.xpl

  # Windows and Linux carry the only automatic correctness signal those
  # platforms get: it compiles, and the SDK-free tests pass. Nothing here says
  # anything about loading in the sim — see issue #24.
  build-linux:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: sudo apt-get update -q && sudo apt-get install -y libgl-dev nasm

      - name: Setup dependencies
        run: make setup

      - name: Build
        run: |
          RELEASE_FLAG=""
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then RELEASE_FLAG="-DRELEASE=ON"; fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release $RELEASE_FLAG -Wno-dev
          cmake --build build --parallel

      - name: Run tests
        run: ./build/xp_gauge_streamer_tests

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: xp_gauge_streamer-linux
          path: build/xp_gauge_streamer.xpl

  build-windows:
    needs: [lint]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # The setup recipes are bash with curl, tar and unzip; Git Bash has all of
      # it, which is smaller than maintaining a second download implementation.
      - name: Install make and nasm
        run: choco install make nasm --no-progress -y

      - name: Setup dependencies
        shell: bash
        run: make setup

      - name: Build
        shell: bash
        run: |
          RELEASE_FLAG=""
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then RELEASE_FLAG="-DRELEASE=ON"; fi
          cmake -B build -A x64 $RELEASE_FLAG
          cmake --build build --config Release --parallel

      - name: Run tests
        shell: bash
        run: ./build/Release/xp_gauge_streamer_tests.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: xp_gauge_streamer-windows
          path: build/Release/xp_gauge_streamer.xpl

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, build-macos]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: xp_gauge_streamer-macos
          path: dist/macos

      - name: Build ZIP
        run: |
          mkdir -p dist/xp_gauge_streamer/mac_x64
          cp dist/macos/xp_gauge_streamer.xpl dist/xp_gauge_streamer/mac_x64/xp_gauge_streamer.xpl
          cp -R web dist/xp_gauge_streamer/web
          cp -R config dist/xp_gauge_streamer/config
          cd dist && zip -r xp_gauge_streamer.zip xp_gauge_streamer/

      - name: Create release with assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/xp_gauge_streamer.zip
          generate_release_notes: true
