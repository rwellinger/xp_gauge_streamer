name: Build

on:
  pull_request:
    branches: [main]
    # A pull request touching nothing but prose cannot break a compile, so it
    # does not pay for one. The filter applies only when *every* changed file
    # matches — a commit that edits the README and a source file still builds.
    #
    # Careful if main ever becomes a protected branch with required checks: a
    # skipped workflow reports nothing, and a required check that never
    # reports blocks the merge for good. The way out then is a job that always
    # runs and decides for itself whether to do any work.
    paths-ignore:
      - '**.md'
      - 'images/**'
      - '.cursor/**'
      - 'LICENSE'
  # Tags are never filtered: a release builds whatever it is cut from.
  push:
    tags:
      - 'v*'

jobs:
  # clang-tidy runs once, on the canonical platform. It could now run anywhere —
  # the build configures on all three — but a second opinion from a second
  # compiler is not worth three times the lint time.
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"


      - name: Cache SDK and vendored dependencies
        uses: actions/cache@v4
        with:
          path: |
            sdk
            vendor
          # The Makefile holds every dependency version, so it is the key.
          key: deps-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Setup dependencies
        run: make setup

      # Through the Makefile rather than a second clang-tidy invocation here:
      # the file list has to come from compile_commands.json, and one copy of
      # that logic is enough.
      - name: Run clang-tidy
        run: make lint

  build-macos:
    needs: [lint]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5


      - name: Cache SDK and vendored dependencies
        uses: actions/cache@v4
        with:
          path: |
            sdk
            vendor
          # The Makefile holds every dependency version, so it is the key.
          key: deps-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Setup dependencies
        run: make setup

      - name: Build
        run: |
          RELEASE_FLAG=""
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then RELEASE_FLAG="-DRELEASE=ON"; fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release $RELEASE_FLAG -Wno-dev
          cmake --build build --parallel

      - name: Run tests
        run: ./build/xp_gauge_streamer_tests

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: xp_gauge_streamer-macos
          path: build/xp_gauge_streamer.xpl

  # Windows and Linux carry the only automatic correctness signal those
  # platforms get: it compiles, and the SDK-free tests pass. Nothing here says
  # anything about loading in the sim — see issue #24.
  build-linux:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: sudo apt-get update -q && sudo apt-get install -y libgl-dev nasm


      - name: Cache SDK and vendored dependencies
        uses: actions/cache@v4
        with:
          path: |
            sdk
            vendor
          # The Makefile holds every dependency version, so it is the key.
          key: deps-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Setup dependencies
        run: make setup

      - name: Build
        run: |
          RELEASE_FLAG=""
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then RELEASE_FLAG="-DRELEASE=ON"; fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release $RELEASE_FLAG -Wno-dev
          cmake --build build --parallel

      - name: Run tests
        run: ./build/xp_gauge_streamer_tests

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: xp_gauge_streamer-linux
          path: build/xp_gauge_streamer.xpl

  build-windows:
    needs: [lint]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # The setup recipes are bash with curl, tar and unzip; Git Bash has all of
      # it, which is smaller than maintaining a second download implementation.
      - name: Install make and nasm
        run: choco install make nasm --no-progress -y


      - name: Cache SDK and vendored dependencies
        uses: actions/cache@v4
        with:
          path: |
            sdk
            vendor
          # The Makefile holds every dependency version, so it is the key.
          key: deps-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Setup dependencies
        shell: bash
        run: make setup

      - name: Build
        shell: bash
        run: |
          RELEASE_FLAG=""
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then RELEASE_FLAG="-DRELEASE=ON"; fi
          cmake -B build -A x64 $RELEASE_FLAG
          cmake --build build --config Release --parallel

      - name: Run tests
        shell: bash
        run: ./build/Release/xp_gauge_streamer_tests.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: xp_gauge_streamer-windows
          path: build/Release/xp_gauge_streamer.xpl

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download platform artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: xp_gauge_streamer-*

      # X-Plane's fat plugin layout: one folder holding a binary per platform,
      # so a single ZIP serves everyone.
      - name: Build ZIP
        run: |
          set -euo pipefail

          # A missing artifact must stop the release rather than publish a
          # two-thirds ZIP that looks complete to whoever downloads it.
          for pair in mac_x64:macos lin_x64:linux win_x64:windows; do
            folder="${pair%%:*}"
            binary="dist/xp_gauge_streamer-${pair##*:}/xp_gauge_streamer.xpl"

            if [ ! -f "$binary" ]; then
              echo "::error::no binary for $folder — refusing to publish an incomplete release"
              exit 1
            fi

            mkdir -p "dist/xp_gauge_streamer/$folder"
            cp "$binary" "dist/xp_gauge_streamer/$folder/xp_gauge_streamer.xpl"
          done

          cp -R web dist/xp_gauge_streamer/web
          cp -R config dist/xp_gauge_streamer/config
          cd dist && zip -r xp_gauge_streamer.zip xp_gauge_streamer/

      - name: Create release with assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/xp_gauge_streamer.zip
          generate_release_notes: true
          # Stated on every release rather than in the README alone: whoever
          # downloads this has to know which binary was flown and which was
          # merely compiled.
          body: |
            Unzip into `<X-Plane 12>/Resources/plugins/` — the archive carries a
            binary for each platform in one folder.

            | Platform | State |
            |---|---|
            | macOS (Apple Silicon) | flown by the developer; Intel Macs are not supported |
            | Windows x64 | capture verified in a cloud VM; LAN access from a tablet is not |
            | Linux x64 | **best effort** — compiled by CI, never loaded in the sim |
